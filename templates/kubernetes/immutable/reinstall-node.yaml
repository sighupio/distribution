---
# furyctl apply --reinstall-node: join one reinstalled worker again, as apply.yaml does for every worker.
# The host is furyctl_reinstall_target, not --limit: the join token comes from the first control plane host.
- name: Check the worker to join again
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # An exact member, not a pattern: a group name or a wildcard in hosts would select more machines.
    - name: Check that furyctl_reinstall_target is one worker of the inventory
      ansible.builtin.assert:
        that:
          - furyctl_reinstall_target is defined
          - furyctl_reinstall_target in groups['nodes'] | default([])
          - furyctl_reinstall_target not in groups['control_plane'] | default([])
          - furyctl_reinstall_target not in groups['etcd'] | default([])
        fail_msg: "furyctl_reinstall_target must be one worker of the inventory group nodes."
        quiet: true

# The same token and CA hash that the kube-control-plane role creates for apply.yaml.
- name: Create a join token on the first control plane host
  hosts: control_plane[0]
  gather_facts: false
  become: true
  tasks:
    - name: Create a bootstrap token
      ansible.builtin.command: "kubeadm token create --ttl=30m"
      register: kubernetes_bootstrap_token
      changed_when: true
      no_log: true

    - name: Get the Kubernetes CA hash
      ansible.builtin.shell: >
        set -o pipefail &&
        openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
        openssl rsa -pubin -outform der 2>/dev/null |
        openssl dgst -sha256 -hex |
        sed 's/^.* /sha256:/'
      register: kubernetes_ca_hash
      changed_when: false

- name: Join the worker
  hosts: "{{ furyctl_reinstall_target | default([]) }}"
  become: true
  vars:
    kubernetes_bootstrap_token: "{{ hostvars[groups.control_plane[0]].kubernetes_bootstrap_token.stdout }}"
    kubernetes_ca_hash: "{{ hostvars[groups.control_plane[0]].kubernetes_ca_hash.stdout }}"
  roles:
    - containerd
    - kube-worker

- import_playbook: nodes-labels-annotations.yaml
