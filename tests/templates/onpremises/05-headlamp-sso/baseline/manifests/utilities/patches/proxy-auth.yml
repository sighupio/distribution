---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
spec:
  template:
    spec:
      containers:
        - name: headlamp
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
            - "-proxy-auth=true"
