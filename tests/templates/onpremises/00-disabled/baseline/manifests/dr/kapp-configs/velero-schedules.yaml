# This file is used to tell kapp to ignore the changes in the status fiels
# of velero Schedules.

apiVersion: kapp.k14s.io/v1alpha1
kind: Config
metadata:
  name: dummy-dr # needed so kustomize won't complain
rebaseRules:
  - path: [status]
    type: copy
    sources: [existing]
    resourceMatchers:
      - apiVersionKindMatcher:
          apiVersion: velero.io/v1
          kind: Schedule
