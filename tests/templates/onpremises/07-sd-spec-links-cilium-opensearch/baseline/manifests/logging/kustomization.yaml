---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../vendor/modules/logging/katalog/logging-operator
  - ../../../vendor/modules/logging/katalog/logging-operated
  - kapp-configs/logging-operator-crd.yaml
  - ../../../vendor/modules/logging/katalog/minio-ha
  - resources/ingress-infra.yml
  - ../../../vendor/modules/logging/katalog/configs/audit
  - ../../../vendor/modules/logging/katalog/configs/events
  - ../../../vendor/modules/logging/katalog/configs/infra
  - ../../../vendor/modules/logging/katalog/configs/ingress-haproxy
  - ../../../vendor/modules/logging/katalog/configs/kubernetes
  - ../../../vendor/modules/logging/katalog/configs/systemd
  - ../../../vendor/modules/logging/katalog/opensearch-dashboards
  - ../../../vendor/modules/logging/katalog/opensearch-single

patches:
  - path: patches/infra-nodes.yml
  - path: patches/minio.yml
  - path: patches/opensearch.yml
secretGenerator:
  - name: minio-logging
    namespace: logging
    behavior: replace
    envs:
      - patches/minio.root.env
