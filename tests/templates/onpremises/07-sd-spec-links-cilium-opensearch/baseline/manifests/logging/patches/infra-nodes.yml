---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-cluster-master
  namespace: logging
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/role: infra
      tolerations:
        - effect: NoSchedule
          key: node.kubernetes.io/role
          value: infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: logging
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/role: infra
      tolerations:
        - effect: NoSchedule
          key: node.kubernetes.io/role
          value: infra
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ism-policy-cronjob
  namespace: logging
spec:
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            node.kubernetes.io/role: infra
          tolerations:
            - effect: NoSchedule
              key: node.kubernetes.io/role
              value: infra
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: index-patterns-cronjob
  namespace: logging
spec:
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            node.kubernetes.io/role: infra
          tolerations:
            - effect: NoSchedule
              key: node.kubernetes.io/role
              value: infra
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio-logging
  namespace: logging
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/role: infra
      tolerations:
        - effect: NoSchedule
          key: node.kubernetes.io/role
          value: infra
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-logging-buckets-setup
  namespace: logging
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/role: infra
      tolerations:
        - effect: NoSchedule
          key: node.kubernetes.io/role
          value: infra
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: Logging
metadata:
  name: infra
spec:
  fluentd:
    nodeSelector:
      node.kubernetes.io/role: infra
    tolerations:
      - effect: NoSchedule
        key: node.kubernetes.io/role
        value: infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-operator
  namespace: logging
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/role: infra
      tolerations:
        - effect: NoSchedule
          key: node.kubernetes.io/role
          value: infra
---
apiVersion: logging-extensions.banzaicloud.io/v1alpha1
kind: EventTailer
metadata:
  name: kubernetes
spec:
  workloadOverrides:
    nodeSelector:
      node.kubernetes.io/role: infra
    tolerations:
      - effect: NoSchedule
        key: node.kubernetes.io/role
        value: infra
