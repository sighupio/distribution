# This is a test case furyctl.yaml to assert that the distribution templates are generating the right output
# This test verifies the sd-spec links for Cilium, OpenSearch, external backends and ingress host overrides
---
apiVersion: kfd.sighup.io/v1alpha2
kind: OnPremises
metadata:
  name: sd-spec-links-cilium-opensearch
spec:
  distributionVersion: dummy # config based on v1.34.1, but we check against main
  kubernetes:
    pkiFolder: dummy
    ssh:
      username: dummy
      keyPath: dummy
    dnsZone: example.com
    controlPlaneAddress: api.example.com
    podCidr: 10.0.0.0/16
    svcCidr: 10.1.0.0/16
    loadBalancers:
      enabled: false
    masters:
      hosts:
        - name: master
          ip: 10.0.0.1
    nodes:
      - name: nodes
        hosts:
          - name: node
            ip: 10.0.0.2
  distribution:
    common:
      nodeSelector:
        node.kubernetes.io/role: infra
      tolerations:
        - effect: NoSchedule
          key: node.kubernetes.io/role
          value: infra
    modules:
      networking:
        type: cilium
        cilium:
          podCidr: "172.16.0.0/16"
          maskSize: "24"
      ingress:
        baseDomain: internal.example.com
        nginx:
          type: none
        haproxy:
          type: dual
          tls:
            provider: certManager
        certManager:
          clusterIssuer:
            name: letsencrypt-fury
            email: example@sighup.io
            type: http01
      logging:
        type: opensearch
        opensearch:
          type: single
        minio:
          storageSize: "20Gi"
        overrides:
          ingresses:
            opensearchDashboards:
              host: logs.custom.example.com
      monitoring:
        type: prometheus
        overrides:
          ingresses:
            grafana:
              host: grafana.custom.example.com
      tracing:
        type: tempo
        tempo:
          backend: externalEndpoint
          externalEndpoint:
            bucketName: dummy
            accessKeyId: secret
            secretAccessKey: secret
            endpoint: s3.example.com
      policy:
        type: kyverno
        kyverno:
          additionalExcludedNamespaces: ["dummy"]
          installDefaultPolicies: true
          validationFailureAction: Enforce
      dr:
        type: on-premises
        velero: {}
      auth:
        provider:
          type: none
        baseDomain: example.com
        oidcKubernetesAuth:
          enabled: true
          clientID: dummy-oidc-client-id
          clientSecret: dummy-oidc-client-secret
          sessionSecurityKey: dummy-oidc-session-key
        dex:
          connectors:
            - type: oidc
              id: oidc
              name: OIDC
              config:
                clientID: client-id
                clientSecret: client-secret
                issuer: https://dex.example.com
        overrides:
          ingresses:
            gangplank:
              host: kubeconfig.custom.example.com
              ingressClass: internal
      utilities:
        headlamp:
          type: token-auth
    customPatches:
      patches:
        - path: dummy/folder
