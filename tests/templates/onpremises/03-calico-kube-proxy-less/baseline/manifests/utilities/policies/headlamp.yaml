---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-egress-kube-apiserver
  namespace: headlamp
  labels:
    cluster.kfd.sighup.io/module: utilities
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  egress:
    - ports:
        - port: 6443
          protocol: TCP
