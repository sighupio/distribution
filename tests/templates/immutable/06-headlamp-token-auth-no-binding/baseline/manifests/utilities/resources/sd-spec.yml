---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sd-spec
  namespace: headlamp
data:
  info.json: |
    {
      "cluster": {
        "kind": "Immutable",
        "name": "no-modules-enabled"
      },
      "distributionVersion": "v1.36.0",
      "links": [
        {
          "module": "auth",
          "name": "Gangplank",
          "url": "https://gangplank.example.com"
        },
        {
          "module": "ingress",
          "name": "Forecastle",
          "url": "https://directory.internal.example.com"
        },
        {
          "module": "logging",
          "name": "MinIO",
          "url": "https://minio-logging.internal.example.com"
        },
        {
          "module": "monitoring",
          "name": "Grafana",
          "url": "https://grafana.internal.example.com"
        },
        {
          "module": "monitoring",
          "name": "Prometheus",
          "url": "https://prometheus.internal.example.com"
        },
        {
          "module": "monitoring",
          "name": "Alertmanager",
          "url": "https://alertmanager.internal.example.com"
        },
        {
          "module": "monitoring",
          "name": "MinIO",
          "url": "https://minio-monitoring.internal.example.com"
        },
        {
          "module": "networking",
          "name": "Whisker",
          "url": "https://whisker.internal.example.com"
        },
        {
          "module": "policy",
          "name": "Gatekeeper Policy Manager",
          "url": "https://gpm.internal.example.com"
        },
        {
          "module": "tracing",
          "name": "MinIO",
          "url": "https://minio-tracing.internal.example.com"
        }
      ],
      "moduleVersions": {
        "auth": "v0.8.0",
        "aws": "v5.4.0",
        "dr": "v3.5.0",
        "ingress": "v5.2.0",
        "logging": "v5.5.0",
        "monitoring": "v4.3.0",
        "networking": "v4.1.0",
        "opa": "v1.18.0",
        "tracing": "v1.6.0",
        "utilities": "v1.0.0"
      },
      "modules": {
        "auth": {
          "provider": {
            "type": "sso"
          }
        },
        "dr": {
          "type": "on-premises"
        },
        "ingress": {
          "haproxy": {
            "type": "none"
          },
          "nginx": {
            "type": "dual"
          }
        },
        "logging": {
          "type": "loki"
        },
        "monitoring": {
          "type": "mimir"
        },
        "networking": {
          "type": "calico"
        },
        "policy": {
          "type": "gatekeeper"
        },
        "tracing": {
          "type": "tempo"
        },
        "utilities": {
          "headlamp": {
            "type": "token-auth"
          }
        }
      }
    }
