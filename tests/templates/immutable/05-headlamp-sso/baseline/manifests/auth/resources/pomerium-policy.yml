address: ":8080"
metrics_address: ":9090"

insecure_server: true
autocert: false

routes:
  - from: https://prometheus.internal.example.com
    to: http://prometheus-k8s.monitoring.svc.cluster.local:9090
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://alertmanager.internal.example.com
    to: http://alertmanager-main.monitoring.svc.cluster.local:9093
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://grafana.internal.example.com
    to: http://grafana.monitoring.svc.cluster.local:3000
    allow_websockets: true
    host_rewrite_header: true
    preserve_host_header: true
    pass_identity_headers: true
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://minio-monitoring.internal.example.com
    to: http://minio-monitoring-console.monitoring.svc.cluster.local:9001
    allow_websockets: true
    preserve_host_header: true
    policy:
      - allow:
          and:
            - authenticated_user: true

  
  - from: https://directory.internal.example.com
    to: http://forecastle.forecastle.svc.cluster.local
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://minio-logging.internal.example.com
    to: http://minio-logging-console.logging.svc.cluster.local:9001
    allow_websockets: true
    preserve_host_header: true
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://minio-tracing.internal.example.com
    to: http://minio-tracing-console.tracing.svc.cluster.local:9001
    allow_websockets: true
    preserve_host_header: true
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://gpm.internal.example.com
    to: http://gatekeeper-policy-manager.gatekeeper-system.svc.cluster.local
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://whisker.internal.example.com
    to: http://whisker.calico-system.svc.cluster.local:8081
    policy:
      - allow:
          and:
            - authenticated_user: true
  - from: https://headlamp.internal.example.com
    to: http://headlamp.headlamp.svc.cluster.local:80
    allow_websockets: true
    preserve_host_header: true
    # Two distinct mechanisms are needed, both required (see headlamp/patches/proxy-auth.yml.tpl,
    # which adds -proxy-auth=true to the Deployment - without it these headers are ignored):
    # 1. Authorization: Headlamp's backend forwards this unchanged to the API server, which
    #    validates it and applies plain Kubernetes RBAC per user/group (see the utilities
    #    module's examples/oidc-rbac).
    # 2. X-Forwarded-*: Headlamp's own frontend login gate (a separate concern from API auth)
    #    only bypasses its "paste your token" screen when -proxy-auth sees these - see
    #    https://headlamp.dev/docs/latest/installation/in-cluster/identity-aware-proxy/.
    #    X-Forwarded-Id-Token must carry the RAW token, with no "Bearer " prefix.
    set_request_headers:
      Authorization: "Bearer ${pomerium.id_token}"
      X-Forwarded-Id-Token: "${pomerium.id_token}"
    jwt_claims_headers:
      X-Forwarded-User: email
      X-Forwarded-Email: email
      X-Forwarded-Group: groups
    policy:
      - allow:
          and:
            - authenticated_user: true

